name: "Setup Node Environment"
description: "Sets up Node.js and installs dependencies with caching"
inputs:
  working-directory:
    description: "Directory to run npm ci in"
    required: false
    default: "."
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"

runs:
  using: "composite"
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: "**/package-lock.json"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --ignore-scripts --legacy-peer-deps

    - name: Install esbuild platform binary
      shell: bash
      run: npm_config_ignore_scripts=false npm rebuild esbuild

    - name: Build shared package
      shell: bash
      run: npm run build -w @color-app/shared
