name: "Setup Node Environment"
description: "Sets up Node.js and installs dependencies with caching"
inputs:
  working-directory:
    description: "Directory to run npm ci in"
    required: false
    default: "."
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"

runs:
  using: "composite"
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: "**/package-lock.json"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --legacy-peer-deps

    - name: Cache shared package build
      id: shared-build-cache
      uses: actions/cache@v5
      with:
        path: packages/shared/dist
        key: shared-build-${{ hashFiles('packages/shared/src/**', 'packages/shared/tsup.config.ts', 'packages/shared/package.json') }}

    - name: Build shared package
      if: steps.shared-build-cache.outputs.cache-hit != 'true'
      shell: bash
      run: NODE_PATH=$(pwd)/node_modules/tsup/node_modules npm run build -w @color-app/shared
