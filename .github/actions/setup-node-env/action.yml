name: "Setup Node Environment"
description: "Sets up Node.js and installs dependencies with caching"
inputs:
  working-directory:
    description: "Directory to run npm ci in"
    required: false
    default: "."
  node-version:
    description: "Node.js version to use"
    required: false
    default: "22"

runs:
  using: "composite"
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: "**/package-lock.json"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci --legacy-peer-deps

    - name: Debug esbuild installation
      shell: bash
      run: |
        echo "=== node_modules/esbuild ==="
        ls node_modules/esbuild 2>/dev/null || echo "NOT FOUND at root"
        echo "=== node_modules/tsup/node_modules/esbuild ==="
        ls node_modules/tsup/node_modules/esbuild 2>/dev/null || echo "NOT FOUND nested in tsup"
        echo "=== node_modules/@esbuild ==="
        ls node_modules/@esbuild 2>/dev/null || echo "NOT FOUND"
        echo "=== npm ls esbuild ==="
        npm ls esbuild --depth=2 2>/dev/null || true
        echo "=== resolve attempt ==="
        node -e "try { console.log(require.resolve('esbuild')); } catch(e) { console.log('FAIL:', e.message); }"

    - name: Build shared package
      shell: bash
      run: npm run build -w @color-app/shared
