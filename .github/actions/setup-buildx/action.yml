name: "Setup Docker Buildx"
description: "Configures Docker Buildx with GHA layer caching wired into the BuildKit daemon, so cache_from/cache_to: type=gha entries in docker-compose.yml are honoured."

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: |
          image=moby/buildkit:latest
          network=host
        buildkitd-config-inline: |
          [registry]
          [worker.oci]
            max-parallelism = 4
          [worker.containerd]
            max-parallelism = 4

          [cache]
            [cache.gha]
              token = "${{ env.ACTIONS_RUNTIME_TOKEN }}"
              url   = "${{ env.ACTIONS_CACHE_URL }}"
              scope = "buildkit"
