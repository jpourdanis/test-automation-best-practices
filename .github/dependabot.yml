version: 2
updates:
  # 1. Web + server + shared: one npm workspace, one lockfile (package-lock.json).
  # Runtime and tooling updates are grouped separately so a bad dev-tool release
  # cannot hold back runtime patches, and vice versa.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # mongoose 9.10 requires mongodb ~7.6; mongodb 7.6.0 breaks the handshake
      # under Jest (NODE-7832). Drop once a fixed 7.6.x ships.
      - dependency-name: "mongoose"
        versions: [">=9.10.0"]
      # 1.32.10 adds @percy/cli-pdf -> pdfjs-dist@2 (GHSA-wgrm-67xf-hhpq, high).
      # Drop once a release no longer pulls in a vulnerable pdfjs-dist.
      - dependency-name: "@percy/cli"
        versions: [">=1.32.10"]
    labels:
      - "dependencies"

  # 2. Mobile: standalone project with its own lockfile (mobile/package-lock.json).
  # It consumes the shared package only via mobile/vendor/color-app-shared.tgz,
  # regenerated with `npm run vendor:shared` from the repo root.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "mobile"

  # 3. Update GitHub Actions (e.g., actions/checkout@v4)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"

  # 4. Update Docker base images (e.g., mcr.microsoft.com/playwright)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
      - "docker"
