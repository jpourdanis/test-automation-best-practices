name: Mobile Build (EAS)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "packages/shared/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ==========================================
  # LINT
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Lint
        working-directory: mobile
        run: npm run lint

  # ==========================================
  # iOS SIMULATOR BUILD
  # ==========================================
  build-ios:
    name: iOS Simulator Build (EAS)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.13.0 --ignore-scripts

      - name: Submit iOS Simulator Build to EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run build:ios

  # ==========================================
  # ANDROID APK BUILD
  # ==========================================
  build-android:
    name: Android APK Build (EAS)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.13.0 --ignore-scripts

      - name: Submit Android APK Build to EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run build:android
