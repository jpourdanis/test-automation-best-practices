name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
      - ".github/workflows/mobile-native-build.yml"
  workflow_dispatch:
    inputs:
      ios-build-source:
        description: "Where to build the iOS simulator app"
        type: choice
        options: [local, eas]
        default: local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ==========================================
  # LINT
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Lint
        working-directory: mobile
        run: npm run lint

  # ==========================================
  # NATIVE BUILDS (local, on GitHub runners, no EAS credits)
  # Running on main also seeds the binary/Gradle/Pods caches that PR runs of
  # mobile-e2e.yml can read.
  # ==========================================
  build-ios:
    name: iOS Simulator Build
    needs: lint
    uses: ./.github/workflows/mobile-native-build.yml
    with:
      platform: ios
      ios-build-source: ${{ inputs.ios-build-source || 'local' }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-android:
    name: Android APK Build
    needs: lint
    uses: ./.github/workflows/mobile-native-build.yml
    with:
      platform: android
