name: Mobile E2E Tests

on:
  pull_request:
    branches: [main, react_native]
    paths: ["mobile/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ==========================================
  # SECURITY TESTING (Mobile)
  # Runs only when mobile/** changes (see `on.pull_request.paths` above),
  # scoped to mobile's own package-lock.json rather than the root Trivy fs
  # scan in ci.yml, which explicitly skips mobile for this reason.
  # ==========================================
  mobile-security:
    name: Security Tests (Mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "mobile/package-lock.json"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: NPM Vulnerability Audit (Mobile)
        working-directory: mobile
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Create Allure results directory
        run: mkdir -p allure-results

      - name: Download Trivy JUnit template
        run: curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/junit.tpl -o junit.tpl

      - name: Run Trivy vulnerability scanner on mobile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          scan-ref: "mobile"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          skip-dirs: "node_modules/npm/node_modules"
          exit-code: "1"
          format: "template"
          template: "@${{ github.workspace }}/junit.tpl"
          output: "allure-results/trivy-mobile.xml"

      - name: Upload Trivy Mobile Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-security-mobile
          path: allure-results/
          retention-days: 1

  # ==========================================
  # STATIC ANALYSIS (Mobile)
  # ==========================================
  mobile-static-analysis:
    name: Static Analysis (Mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run ESLint (Mobile)
        working-directory: mobile
        run: npm run lint

  # ==========================================
  # UNIT TESTS (Mobile)
  # ==========================================
  mobile-unit-tests:
    name: Unit Tests (Mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Run Mobile Unit Tests
        run: npm run test:unit
        working-directory: mobile

      - name: Upload Mobile Coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage-lcov
          path: mobile/coverage/lcov.info
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Mobile Unit Test Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-mobile-unit-testing
          path: mobile/allure-results/
          retention-days: 1

  # ==========================================
  # SONARCLOUD ANALYSIS (Mobile)
  # ==========================================
  mobile-sonar:
    name: SonarCloud Analysis (Mobile)
    needs: [mobile-unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Mobile Coverage
        uses: actions/download-artifact@v8
        with:
          name: mobile-coverage-lcov
          path: mobile/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: mobile
          args: >
            -Dsonar.projectKey=jpourdanis_test-automation-best-practices
            -Dsonar.organization=jpourdanis
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.test.tsx,src/**/*.test.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
          skipSignatureVerification: true

  # ==========================================
  # iOS E2E TESTS (Appium + iOS Simulator)
  # ==========================================
  ios-e2e:
    name: iOS E2E Tests (Appium + Simulator)
    needs: [mobile-unit-tests, mobile-static-analysis]
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Build shared package
        run: npm run build -w packages/shared

      # Point xcode-select at the full Xcode app so simctl and
      # the XCUITest driver have access to the simulator runtime.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: List available iPhone simulators
        run: xcrun simctl list devices available | grep -E "iPhone [0-9]"

      # Boot the simulator early so WDA compilation doesn't eat into the
      # session creation timeout window. bootstatus -b blocks until ready.
      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 \(" | head -1 | grep -Eo '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}')
          echo "Booting simulator: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || echo "Already booted"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      # Capture the simulator's system log around Expo Go / expo-updates so a
      # failed deep link (e.g. a failed manifest fetch) is diagnosable instead
      # of just showing up as "element never appeared" in the wdio output.
      - name: Start iOS system log capture
        run: |
          xcrun simctl spawn "$SIMULATOR_UDID" log stream --level debug --predicate 'process == "Exponent" OR eventMessage CONTAINS[c] "expo"' > mobile/e2e/ios-simulator.log 2>&1 &
          echo "IOSLOG_PID=$!" >> $GITHUB_ENV

      # Starts Metro and, since the simulator is already booted, has Expo
      # CLI auto-install Expo Go (matching this project's SDK version) and
      # open our project inside it. No EAS build/binary is needed to test.
      - name: Start Metro dev server + Expo Go
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          CI=1 npx expo start --ios --go > e2e/metro.log 2>&1 &
          echo "METRO_PID=$!" >> $GITHUB_ENV
          for i in {1..150}; do
            if curl -s http://127.0.0.1:8081/status > /dev/null; then
              echo "Metro is ready (attempt $i)"
              # Pre-warm the JS bundle so Expo Go's first request (triggered by the
              # deep link in wdio's `before` hook) doesn't hit a cold Metro compile
              # and blow past the element-wait timeout in the page object.
              curl -s --max-time 240 "http://127.0.0.1:8081/index.bundle?platform=ios&dev=true" -o /dev/null
              exit 0
            fi
            echo "Waiting for Metro... attempt $i/150"
            sleep 2
          done
          echo "::error::Metro failed to start within 300 seconds. Log output:"
          cat e2e/metro.log
          exit 1

      # Cache the compiled WDA binary so it only builds from source on the
      # first run or after the xcuitest driver version changes.
      - name: Cache WDA derived data
        uses: actions/cache@v5
        with:
          path: mobile/e2e/.wda-derived-data
          key: wda-${{ runner.os }}-ios18.5-${{ hashFiles('mobile/package.json') }}

      # Expo Go's first-ever launch on a fresh simulator shows its own
      # onboarding screen before anything else, which would swallow our
      # deep link. Pre-mark onboarding as finished so it goes straight
      # to loading whatever project is deep-linked to it.
      - name: Skip Expo Go onboarding
        run: |
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write host.exp.Exponent EXHomeIsNuxFinishedDefaultsKey -bool YES
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write host.exp.Exponent EXKernelDisableNuxDefaultsKey -bool YES

      # Install the XCUITest driver into a project-local APPIUM_HOME so the
      # version is pinned to the repo and isolated from any global Appium install.
      - name: Install Appium XCUITest driver
        working-directory: mobile
        env:
          APPIUM_HOME: ${{ github.workspace }}/mobile/.appium
        run: |
          npm run appium:install-drivers
          npm exec --ignore-scripts -- appium driver list --installed

      - name: Start Appium Server
        working-directory: mobile
        env:
          APPIUM_HOME: ${{ github.workspace }}/mobile/.appium
        run: |
          npm exec --ignore-scripts -- appium --port 4723 --log-level info > e2e/appium.log 2>&1 &
          APPIUM_PID=$!
          echo "APPIUM_PID=$APPIUM_PID" >> $GITHUB_ENV
          for i in {1..60}; do
            if ! kill -0 "$APPIUM_PID" 2>/dev/null; then
              echo "::error::Appium process exited unexpectedly. Log output:"
              cat e2e/appium.log
              exit 1
            fi
            if curl -s http://127.0.0.1:4723/status > /dev/null; then
              echo "Appium is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for Appium... attempt $i/60"
            sleep 2
          done
          echo "::error::Appium failed to start within 120 seconds. Log output:"
          cat e2e/appium.log
          exit 1

      - name: Run iOS E2E tests
        working-directory: mobile
        env:
          APPIUM_HOME: ${{ github.workspace }}/mobile/.appium
          IOS_DEVICE: "iPhone 16"
          IOS_VERSION: "18.5"
        run: npm exec --ignore-scripts -- wdio run e2e/wdio.ios.conf.ts

      - name: Stop Appium Server
        if: always()
        run: |
          if [ -n "$APPIUM_PID" ]; then
            kill "$APPIUM_PID" || true
          fi
          if [ -n "$METRO_PID" ]; then
            kill "$METRO_PID" || true
          fi
          if [ -n "$IOSLOG_PID" ]; then
            kill "$IOSLOG_PID" || true
          fi

      - name: Upload Appium server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-appium-log
          path: mobile/e2e/appium.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload iOS simulator log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-simulator-log
          path: mobile/e2e/ios-simulator.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Metro log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-metro-log
          path: mobile/e2e/metro.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload failure videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-failure-videos
          path: mobile/e2e/videos/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload WDIO results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-wdio-results
          path: |
            mobile/e2e/wdio-*.log
            mobile/e2e/allure-results/
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================
  # Android E2E TESTS (Appium + Emulator)
  # ==========================================
  android-e2e:
    name: Android E2E Tests (Appium + Emulator)
    needs: [mobile-unit-tests, mobile-static-analysis]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Build shared package
        run: npm run build -w packages/shared

      # Enable KVM so the emulator gets hardware acceleration and boots in a
      # reasonable amount of time on the Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: List available Android emulator images
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list | grep "system-images;android-35"

      # Cache the AVD snapshot so the emulator only rebuilds on the first run
      # or when the package.json changes (driver version bump).
      # ANDROID_AVD_HOME is pinned to a workspace-relative path so that
      # avdmanager, the emulator, and the cache action all agree on the
      # location of the .ini / .avd directory pair.
      - name: Cache Android AVD
        id: avd-cache
        uses: actions/cache@v5
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
        with:
          path: ${{ github.workspace }}/.android/avd
          key: avd-api35-${{ runner.os }}-${{ hashFiles('mobile/package.json') }}

      # Create the AVD only on a cache miss. --force is safe because the
      # AVD definition is stateless without a snapshot.
      - name: Create Android AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "system-images;android-35;google_apis;x86_64" \
            --sdk_root=$ANDROID_HOME
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            --name "Pixel_6_API_35" \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"

      # Boot the emulator early so it is ready before Appium starts a session.
      # We poll sys.boot_completed via adb rather than relying on a fixed sleep.
      # ANDROID_AVD_HOME must match the path used in the create/cache steps.
      - name: Boot Android Emulator
        env:
          ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
        run: |
          $ANDROID_HOME/emulator/emulator \
            -avd Pixel_6_API_35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -memory 3072 &
          echo "EMULATOR_PID=$!" >> $GITHUB_ENV
          $ANDROID_HOME/platform-tools/adb wait-for-device
          for i in {1..60}; do
            BOOT=$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Emulator is ready"
              break
            fi
            echo "Waiting for emulator boot... attempt $i/60"
            sleep 5
          done
          if [ "$BOOT" != "1" ]; then
            echo "::error::Android emulator failed to boot within 5 minutes"
            exit 1
          fi
          # Dismiss keyguard and disable animations so the UI is fully interactive
          # and element transitions don't race with Appium element lookups.
          $ANDROID_HOME/platform-tools/adb shell wm dismiss-keyguard || true
          $ANDROID_HOME/platform-tools/adb shell settings put global window_animation_scale 0
          $ANDROID_HOME/platform-tools/adb shell settings put global transition_animation_scale 0
          $ANDROID_HOME/platform-tools/adb shell settings put global animator_duration_scale 0
          # Give system services a moment to settle after boot before Appium connects
          sleep 5

      # Forward the emulator's view of localhost:8081 to the host's Metro
      # process. More reliable in CI than the 10.0.2.2 NAT alias, and it's
      # what a real device connected over USB would use too.
      - name: adb reverse Metro port
        run: $ANDROID_HOME/platform-tools/adb reverse tcp:8081 tcp:8081

      # Starts Metro and, since the emulator is already booted, has Expo
      # CLI auto-install Expo Go (matching this project's SDK version) and
      # open our project inside it. No EAS build/binary is needed to test.
      - name: Start Metro dev server + Expo Go
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          CI=1 npx expo start --android --go > e2e/metro.log 2>&1 &
          echo "METRO_PID=$!" >> $GITHUB_ENV
          for i in {1..150}; do
            if curl -s http://127.0.0.1:8081/status > /dev/null; then
              echo "Metro is ready (attempt $i)"
              # Pre-warm the JS bundle so Expo Go's first request (triggered by the
              # deep link in wdio's `before` hook) doesn't hit a cold Metro compile
              # and blow past the element-wait timeout in the page object.
              curl -s --max-time 240 "http://127.0.0.1:8081/index.bundle?platform=android&dev=true" -o /dev/null
              exit 0
            fi
            echo "Waiting for Metro... attempt $i/150"
            sleep 2
          done
          echo "::error::Metro failed to start within 300 seconds. Log output:"
          cat e2e/metro.log
          exit 1

      # Install the UiAutomator2 driver into a project-local APPIUM_HOME so the
      # version is pinned to the repo and isolated from any global Appium install.
      - name: Install Appium UiAutomator2 driver
        working-directory: mobile
        env:
          APPIUM_HOME: ${{ github.workspace }}/mobile/.appium
        run: |
          npm run appium:install-drivers:android
          npm exec --ignore-scripts -- appium driver list --installed

      - name: Start Appium Server
        working-directory: mobile
        env:
          APPIUM_HOME: ${{ github.workspace }}/mobile/.appium
        run: |
          npm exec --ignore-scripts -- appium --port 4723 --log-level info > e2e/appium.log 2>&1 &
          APPIUM_PID=$!
          echo "APPIUM_PID=$APPIUM_PID" >> $GITHUB_ENV
          for i in {1..60}; do
            if ! kill -0 "$APPIUM_PID" 2>/dev/null; then
              echo "::error::Appium process exited unexpectedly. Log output:"
              cat e2e/appium.log
              exit 1
            fi
            if curl -s http://127.0.0.1:4723/status > /dev/null; then
              echo "Appium is ready (attempt $i)"
              exit 0
            fi
            echo "Waiting for Appium... attempt $i/60"
            sleep 2
          done
          echo "::error::Appium failed to start within 120 seconds. Log output:"
          cat e2e/appium.log
          exit 1

      - name: Start logcat capture
        run: |
          mkdir -p mobile/e2e
          $ANDROID_HOME/platform-tools/adb logcat -v time > mobile/e2e/logcat.txt 2>&1 &
          echo "LOGCAT_PID=$!" >> $GITHUB_ENV

      - name: Run Android E2E tests
        working-directory: mobile
        env:
          APPIUM_HOME: ${{ github.workspace }}/mobile/.appium
          ANDROID_DEVICE: "Pixel_6_API_35"
          ANDROID_VERSION: "15" # Android OS version (API 35 = Android 15)
        run: npm exec --ignore-scripts -- wdio run e2e/wdio.android.conf.ts

      - name: Stop Appium Server
        if: always()
        run: |
          if [ -n "$APPIUM_PID" ]; then
            kill "$APPIUM_PID" || true
          fi
          if [ -n "$METRO_PID" ]; then
            kill "$METRO_PID" || true
          fi
          if [ -n "$LOGCAT_PID" ]; then
            kill "$LOGCAT_PID" || true
          fi

      - name: Upload Appium server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-appium-log
          path: mobile/e2e/appium.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Android logcat
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-logcat
          path: mobile/e2e/logcat.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Metro log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-metro-log
          path: mobile/e2e/metro.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload failure videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-failure-videos
          path: mobile/e2e/videos/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload WDIO results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-wdio-results
          path: |
            mobile/e2e/wdio-*.log
            mobile/e2e/allure-results/
          retention-days: 7
          if-no-files-found: ignore
