name: Release
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only run when CI passed — skip on failure or cancellation
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      # Opt into Node.js 24 action runtime ahead of the forced cutover on June 16 2026.
      # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Use the exact SHA that passed CI, not the current HEAD of main
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        # Release tooling is installed here, pinned, instead of living in
        # devDependencies: semantic-release depends on @semantic-release/npm,
        # which pulls in npm with its own bundled deps that overrides cannot
        # patch, and those would otherwise fail the CI npm audit gate.
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/changelog@6.0.3
          -p @semantic-release/git@10.0.1
          semantic-release
