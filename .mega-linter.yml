# MegaLinter configuration file
# See all available variables at https://oxsecurity.github.io/megalinter/configuration/
---
# ------------------------------------------------------------------------------
# SCOPE
# ------------------------------------------------------------------------------
# Only analyze specific folders
FILTER_REGEX_INCLUDE: "^(src|server)/.*"
FILTER_REGEX_EXCLUDE: "(node_modules|megalinter-reports)/.*"

# Disable linters that conflict with existing setups or are too noisy
DISABLE_LINTERS:
  - REPOSITORY_DEVSKIM
  - REPOSITORY_TRUFFLEHOG
  - REPOSITORY_KINGFISHER
  - REPOSITORY_GRYPE
  - REPOSITORY_KICS
  - REPOSITORY_TRIVY
  - REPOSITORY_OSV_SCANNER
  - COPYPASTE_JSCPD
  - JSON_V8R
  - DOCKERFILE_HADOLINT
  # ESLint variants — disabled; project uses its own ESLint config via `npm run lint`
  - JAVASCRIPT_ES
  - TYPESCRIPT_ES
  - TSX_ESLINT
  # Standard.js — redundant; ESLint + SonarCloud already cover JS/TS code quality
  - JAVASCRIPT_STANDARD
  - TYPESCRIPT_STANDARD
  # Prettier — redundant; `npm run lint` already runs `prettier --check`
  - JAVASCRIPT_PRETTIER
  - TYPESCRIPT_PRETTIER
  # Link checker — slow network I/O in CI, high false-positive rate, no code quality value
  - SPELL_LYCHEE

SPELL_CSPELL_FILTER_REGEX_EXCLUDE: "(src/locales/.*)"
SPELL_LYCHEE_FILTER_REGEX_EXCLUDE: '(server/package.*\.json)'

REPOSITORY_GITLEAKS_CONFIG_FILE: ".gitleaks.toml"
